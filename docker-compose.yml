services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_scraper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_scraper_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data

  scraper:
    build:
      context: .
      target: scraper
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/book_scraper
    # Default is 10s; on SIGTERM the spider's `closed()` callback runs
    # finish_scrape_run + abort_processing_scrape_url_items, which can
    # exceed 10s with a large queue and a slow DB. 30s gives finalize
    # headroom so it persists `close_reason` instead of getting SIGKILLed.
    stop_grace_period: 30s
    volumes:
      - scraper_logs:/var/log

  dashboard:
    build:
      context: .
      target: dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/book_scraper
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scraper_logs:/var/log:ro

volumes:
  pgdata:
  pgdata_test:
  scraper_logs:
