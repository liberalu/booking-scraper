<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} - Book Scraper</title>
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/dashboard.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <div class="app-shell">
        <nav class="top-nav">
            <div class="top-nav-inner">
                <a href="/" class="brand">
                    <span class="brand-mark">BS</span>
                    <span class="brand-copy">
                        <span class="brand-name">BookScraper</span>
                        <span class="brand-subtitle">Admin Console</span>
                    </span>
                </a>
                <ul class="nav-links">
                    <li><a href="/" class="{{ 'active' if active_page == 'overview' else '' }}">Overview</a></li>
                    <li><a href="/shop-books" class="{{ 'active' if active_page == 'shop_books' else '' }}">Shop Books</a></li>
                    <li><a href="/urls" class="{{ 'active' if active_page == 'urls' else '' }}">URLs</a></li>
                    <li><a href="/shops" class="{{ 'active' if active_page == 'shops' else '' }}">Shops</a></li>
                    <li><a href="/runs" class="{{ 'active' if active_page == 'runs' else '' }}">Runs</a></li>
                    <li><a href="/cron" class="{{ 'active' if active_page == 'cron' else '' }}">Cron</a></li>
                    <li><a href="/validation" class="{{ 'active' if active_page == 'issues' else '' }}">Issues</a></li>
                </ul>
                <div class="nav-right">
                    <span class="nav-badge">Live admin</span>
                    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" id="theme-toggle-btn">🌙</button>
                </div>
            </div>
        </nav>
        <main class="container app-main">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon(next);
        }

        function updateToggleIcon(theme) {
            var btn = document.getElementById('theme-toggle-btn');
            if (btn) {
                btn.textContent = theme === 'dark' ? '☀️' : '🌙';
            }
        }

        (function() {
            var theme = localStorage.getItem('theme') || 'light';
            updateToggleIcon(theme);
        })();
    </script>
</body>
</html>
