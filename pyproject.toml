[project]
name = "book-scraper"
version = "0.1.0"
description = "Multi-shop book price scraper for Lithuanian e-shops"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Scrapy>=2.12",
    "scrapy-impersonate>=1.6",
    "pydantic>=2.0",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "psycopg2-binary>=2.9",
    "httpx>=0.28.1",
    "markdownify>=1.1",
    "markdown>=3.7",
    "python-multipart>=0.0.26",
    "croniter>=6.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "docker>=7.0",
]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "pre-commit>=4.0",
    "deptry>=0.22",
    "pip-audit>=2.7",
    "types-Markdown>=3.7",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"book_scraper/dashboard/routes/*.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["scrapy.*", "itemadapter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires database (PostgreSQL on port 5433)",
]

[tool.coverage.run]
source = ["book_scraper"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]

[tool.deptry]
ignore = ["DEP003"]  # self-imports (book_scraper.*) and Scrapy transitive deps (twisted, itemadapter)

[tool.deptry.per_rule_ignores]
DEP002 = [
    "scrapy-impersonate",  # used as Scrapy download handler, not imported directly
    "asyncpg",             # SQLAlchemy async driver, loaded by connection string
    "alembic",             # CLI tool for DB migrations
    "psycopg2-binary",     # SQLAlchemy sync driver, loaded by connection string
    "ruff",                # CLI linter/formatter
    "mypy",                # CLI type checker
    "pytest",              # CLI test runner
    "pytest-asyncio",      # pytest plugin, auto-loaded
    "pytest-cov",          # pytest plugin, auto-loaded
    "pre-commit",          # CLI tool
    "deptry",              # CLI tool
    "pip-audit",           # CLI tool
    "uvicorn",             # ASGI server, run via CLI not imported
    "jinja2",              # used by FastAPI's Jinja2Templates (starlette dependency)
    "python-multipart",    # required by FastAPI Form() parsing (loaded at runtime)
    "types-Markdown",      # mypy stubs for the markdown library (dev-only)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["book_scraper"]
