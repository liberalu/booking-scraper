[project]
name = "book-scraper"
version = "0.1.0"
description = "Multi-shop book price scraper for Lithuanian e-shops"
requires-python = ">=3.12"
dependencies = [
    "Scrapy>=2.12",
    "scrapy-impersonate>=1.6",
    "pydantic>=2.0",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["scrapy.*", "itemadapter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires database (PostgreSQL on port 5433)",
]

[tool.coverage.run]
source = ["book_scraper"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["book_scraper"]
