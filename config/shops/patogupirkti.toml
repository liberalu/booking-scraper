[shop]
name = "patogupirkti"
base_url = "https://www.patogupirkti.lt"

[scraping]
download_delay = 0.5
concurrent_requests_per_domain = 3
batch_size = 100
batch_pause = 10
max_retries = 2
connect_timeout = 5
read_timeout = 15
hard_timeout = 30
batch_timeout = 300

[discover]
url_include_pattern = "^https://www\\.patogupirkti\\.lt/knyga/[^/]+\\.html$"

[discover.sitemap]
url = "https://www.patogupirkti.lt/sitemap/sitemap.xml"
max_age_hours = 168

[discover.categories]
url = [
  "https://www.patogupirkti.lt/grozine-literatura?p={page}",
  "https://www.patogupirkti.lt/dalykine-literatura?p={page}",
  "https://www.patogupirkti.lt/knygos-vaikams?p={page}",
]
max_age_hours = 24
max_pages = 500

[scan]

[match]
trust = 50
