[shop]
name = "almalittera"
base_url = "https://almalittera.lt"

[scraping]
download_delay = 0.3
concurrent_requests_per_domain = 4
batch_size = 100
batch_pause = 5
max_retries = 2
connect_timeout = 10
read_timeout = 30
hard_timeout = 60
batch_timeout = 600

[discover]
url_include_pattern = "https://almalittera\\.lt/products/[^/?#]+"

[discover.categories]
url = "https://almalittera.lt/products.json?limit=250&page={page}"
max_age_hours = 24
max_pages = 40

[scan]

[match]
trust = 50
