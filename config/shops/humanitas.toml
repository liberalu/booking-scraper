[shop]
name = "humanitas"
base_url = "https://www.humanitas.lt"

[scraping]
download_delay = 0.5
concurrent_requests_per_domain = 1
batch_size = 50
batch_pause = 5
max_retries = 2
connect_timeout = 15
read_timeout = 180
hard_timeout = 240
batch_timeout = 600

[flaresolverr]
endpoint = "http://flaresolverr:8191/v1"
max_timeout_ms = 120000
session_ttl_minutes = 25

[discover]
url_include_pattern = "^https://www\\.humanitas\\.lt/produktas/"

[discover.categories]
url = [
  "https://www.humanitas.lt/produktai/visos-kategorijos/?cntnt01page={page}&m575a2product_limit=5000&m575a2filt_leidimo_kalba=Lithuanian",
  "https://www.humanitas.lt/produktai/visos-kategorijos/?cntnt01page={page}&m575a2product_limit=5000&m575a2filt_leidimo_kalba=Lithuanian-English",
]
max_age_hours = 24
max_pages = 3

[scan]

[match]
trust = 70
