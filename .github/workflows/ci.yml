name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: "8.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, dom
          coverage: none
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: Quality gates
        run: make lint PHP=php COMPOSER=composer

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book_scraper_php_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, dom
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Apply the schema
        run: php bin/migrate apply --database=$DATABASE_URL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/book_scraper_php_test

      - name: Test suite
        run: vendor/bin/phpunit
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/book_scraper_php_test
