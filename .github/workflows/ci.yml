name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: "8.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, dom
          coverage: none
          tools: composer
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          composer install --no-interaction --no-progress
          npm ci
      - name: Quality gates
        run: make lint PHP=php COMPOSER=composer
      - name: Dependency security
        run: |
          composer audit --locked
          npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:2586e2a95d1c9b31cb2967feb562948f7d364854453d703039b6efa45fe48417
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: book_scraper_php_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, dom
          coverage: pcov
          tools: composer

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Apply the schema
        run: php bin/migrate apply --database=$DATABASE_URL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/book_scraper_php_test

      - name: Test suite
        run: |
          mkdir -p build
          vendor/bin/phpunit --coverage-clover build/coverage.xml
          php tools/check_coverage.php build/coverage.xml 50
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/book_scraper_php_test

      - name: Schema parity
        run: make schema-gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/book_scraper_php_test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build production image
        run: docker build --tag book-scraper:test .
      - name: Smoke-test production image
        run: |
          docker run --rm --detach --name book-scraper-smoke \
            --publish 127.0.0.1:18002:8000 \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env APP_KEY=base64:Ym9vay1zY3JhcGVyLWNpLWtleS0zMi1ieXRlcyEhISE= \
            --env DASHBOARD_AUTH_DISABLED=true \
            book-scraper:test
          trap 'docker stop book-scraper-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            curl --fail --silent http://127.0.0.1:18002/up >/dev/null && break
            sleep 1
          done
          test "$(docker exec book-scraper-smoke id -u)" = 10001
          curl --fail --silent --dump-header up-headers.txt \
            http://127.0.0.1:18002/up >/dev/null
          curl --fail --silent --dump-header root-headers.txt \
            http://127.0.0.1:18002/ >/dev/null
          ! grep --ignore-case --extended-regexp 'x-powered-by|unpkg' \
            up-headers.txt root-headers.txt
          for header in content-security-policy permissions-policy \
            referrer-policy x-content-type-options x-frame-options; do
            grep --ignore-case --quiet "^${header}:" up-headers.txt
            grep --ignore-case --quiet "^${header}:" root-headers.txt
          done
      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          APP_KEY: base64:Ym9vay1zY3JhcGVyLWNpLWtleS0zMi1ieXRlcyEhISE=
          DASHBOARD_AUTH_USERNAME: ci
          DASHBOARD_AUTH_PASSWORD: ci-only-password
          POSTGRES_PASSWORD: ci-database-password
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
          GRAFANA_DB_PASSWORD: ci-reader-password
